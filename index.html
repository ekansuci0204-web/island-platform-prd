<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindscape</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; background-color: #a3ccf5; user-select: none; display: flex; justify-content: center; align-items: center; }

        .game-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('https://unsplash.com'); 
            background-size: cover; background-position: center; z-index: -1; filter: brightness(0.9);
        }

        /* SADƏ OYUN QUTUSU */
        .game-box {
            background: white; border: 4px solid #4caf50; border-radius: 24px; padding: 25px;
            width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .game-title { font-size: 26px; font-weight: bold; color: #2e7d32; margin-bottom: 15px; }
        .game-input, .game-select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ccc; margin-bottom: 15px; font-size: 16px; outline: none; }
        
        .game-btn {
            width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white;
            background: #ff7a45; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #b33c0d;
        }
        .game-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b33c0d; }

        /* HEYVAN SEÇİMİ SƏHİFƏSİ */
        .companion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .companion-card { background: #f9f9f9; border: 2px solid #e0e0e0; border-radius: 16px; padding: 15px; cursor: pointer; }
        .companion-card.active { border-color: #ff7a45; background: #fff5f0; }
        .companion-emoji { font-size: 32px; }

        /* SƏHİFƏ 3: SƏNİN O İLKİN RAZI LAŞDIĞIMIZ 3 GUŞƏLİ ADAN */
        .map-container { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .zone-card { background: #e0f2f1; border: 2px solid #26a69a; border-radius: 16px; padding: 15px; cursor: pointer; font-weight: bold; color: #004d40; }
        .zone-card:active { background: #b2dfdb; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-background"></div>

    <!-- SƏHİFƏ 1: AD YAZMAQ -->
    <div class="game-box" id="page1">
        <div class="game-title">🏝️ Mindscape</div>
        <input type="text" id="childName" class="game-input" placeholder="Adınızı və ya ləqəbinizi yazın...">
        <select id="ageSelect" class="game-input">
            <option value="8-12">8 - 12 Yaş</option>
            <option value="13-18">13 - 18 Yaş</option>
        </select>
        <button class="game-btn" onclick="goToPage2()">Davam Et ➔</button>
    </div>

    <!-- SƏHİFƏ 2: HEYVAN SEÇMƏK -->
    <div class="game-box hidden" id="page2">
        <div class="game-title">🐼 Bələdçini Seç</div>
        <div class="companion-grid">
            <div class="companion-card" id="p1" onclick="pickCompanion('p1', '🐼 Panda')"><div class="companion-emoji">🐼</div><h3>Panda</h3></div>
            <div class="companion-card" id="p2" onclick="pickCompanion('p2', '🦊 Tülkü')"><div class="companion-emoji">🦊</div><h3>Tülkü</h3></div>
            <div class="companion-card" id="p3" onclick="pickCompanion('p3', '🐰 Dovşan')"><div class="companion-emoji">🐰</div><h3>Dovşan</h3></div>
            <div class="companion-card" id="p4" onclick="pickCompanion('p4', '🐻 Ayı')"><div class="companion-emoji">🐻</div><h3>Ayı</h3></div>
        </div>
        <button class="game-btn" onclick="goToPage3()">Adaya Daxil Ol 🌱</button>
    </div>

    <!-- SƏHİFƏ 3: SADƏ VƏ REAL ADA XƏRİTƏSİ -->
    <div class="game-box hidden" id="page3">
        <div class="game-title" id="welcomeTitle">Xoş gəldin!</div>
        <p style="margin-bottom: 15px; color: #666;" id="companionDisplay">Bələdçin: -</p>
        <div class="map-container">
            <div class="zone-card" onclick="alert('Sakitlik Gölü: Nəfəs idmanı tezliklə açılacaq!')">🌊 Sakitlik Gölü</div>
            <div class="zone-card" onclick="alert('Empatiya Bağı: Psixoloji testlər tezliklə açılacaq!')">🌸 Empatiya Bağı</div>
            <div class="zone-card" onclick="alert('Hikmət Kitabxanası: Videolar tezliklə açılacaq!')">📚 Hikmət Kitabxanası</div>
        </div>
    </div>

    <script>
        let selectedCompanion = "";
        let childName = "";

        function goToPage2() {
            childName = document.getElementById('childName').value;
            if(childName == "") {
                alert("Zəhmət olmasa bir ad qeyd edin!");
                return;
            }
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        function pickCompanion(id, name) {
            document.querySelectorAll('.companion-card').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            selectedCompanion = name;
        }

        function goToPage3() {
            if(selectedCompanion == "") {
                alert("Zəhmət olmasa bir heyvan seçin!");
                return;
            }
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.remove('hidden');
            document.getElementById('welcomeTitle').innerText = "🏝️ " + childName + ", Xoş Gəldin!";
            document.getElementById('companionDisplay').innerText = "Sənin virtual bələdçin: " + selectedCompanion;
        }
    </script>
</body>
</html>
