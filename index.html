<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mindscape - Oyun Adası</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; background-color: #a3ccf5; user-select: none; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        .game-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #87ceeb, #a3ccf5); z-index: -2;
        }

        /* 🌴 SƏNİN DEDİYİN ƏSL VİZUAL OYUN ADASI QURULUŞU */
        .island-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-image: url('https://unsplash.com'); background-size: cover; background-position: center; }
        
        /* HUD STRIP */
        .game-hud {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 480px; display: flex; justify-content: space-between; z-index: 100;
        }
        .hud-item { background: rgba(255, 255, 255, 0.95); border: 2px solid #4caf50; border-radius: 50px; padding: 6px 12px; font-weight: bold; font-size: 11px; color: #2e7d32; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* ZONALARIN VİZUAL YERLƏŞMƏLƏRİ */
        .island-object {
            position: absolute; background: rgba(255, 255, 255, 0.96); border: 3px solid #ff7a45; border-radius: 18px;
            padding: 10px 14px; text-align: center; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.15); z-index: 20;
        }
        .obj-emoji { font-size: 24px; }
        .obj-title { font-size: 10px; font-weight: bold; color: #333; margin-top: 2px; }

        #lake-zone { top: 22%; left: 6%; border-color: #00bcd4; }
        #waterfall-zone { top: 18%; right: 6%; border-color: #2196f3; }
        #forest-zone { bottom: 25%; left: 6%; border-color: #4caf50; }

        /* ORTADA DURAN CANLI HEYVANIN */
        .hero-character {
            position: absolute; top: 45%; left: 45%; font-size: 48px; text-align: center; z-index: 30;
            animation: heroFloat 2.5s ease-in-out infinite; cursor: pointer;
        }
        .hero-bubble {
            position: absolute; top: -42px; left: 50%; transform: translateX(-50%);
            background: white; padding: 5px 10px; border-radius: 10px; font-size: 11px; font-weight: bold;
            border: 2px solid #ff7a45; white-space: nowrap; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        @keyframes heroFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
</head>
<body>

    <div class="game-background"></div>

    <!-- HUD PANELİ (DƏRHAL AKTİVDİR) -->
    <div class="game-hud" id="gameHud">
        <div class="hud-item">👤 Uşaq: Mindscape_User</div>
        <div class="hud-item">🍃 <span id="hudLeaves">50</span> Yarpaq</div>
        <div class="hud-item">⭐ <span id="hudXp">100</span> XP</div>
    </div>

    <!-- SƏHİFƏ 4: ƏSL VİZUAL OYUN ADASI (BİRBAŞA AÇILIR) -->
    <div class="island-container" id="islandMap">
        <div class="hero-character" onclick="talkToHero()">
            <div class="hero-bubble" id="heroText">Salam! Gəl adanı böyüdək!</div>
            <span id="heroEmoji">🐼</span>
        </div>

        <div class="island-object" id="lake-zone" onclick="alert('🌊 Sakitlik Gölü: Nəfəs İdmanı mini-oyunu tezliklə aktivləşəcək!')">
            <div class="obj-emoji">🌊</div><div class="obj-title">Sakitlik Gölü</div>
        </div>
        <div class="island-object" id="waterfall-zone" onclick="alert('🏞️ Sakitlik Şəlaləsi: Relaksasiya tapşırıqları tezliklə gəlir!')">
            <div class="obj-emoji">🏞️</div><div class="obj-title">Sakitlik Şəlaləsi</div>
        </div>
        <div class="island-object" id="forest-zone" onclick="alert('🌳 Meşə Zonası: Özünü tanıma testləri çox yaxında!')">
            <div class="obj-emoji">🌳</div><div class="obj-title">Gizli Meşə</div>
        </div>
    </div>

    <script>
        function talkToHero() {
            let phrases = ["Bu gün möhtəşəm görünürsən!", "Gölə klikləyib oyun oynayaq?", "Missiyaları tamamlayaq?"];
            document.getElementById('heroText').innerText = phrases[Math.floor(Math.random() * phrases.length)];
        }
    </script>
</body>
</html>
