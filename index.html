<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindscape - İnteraktiv Ada</title>
    <style>
        /* ÜMUMİ RESET VƏ OYUN AYARLARI */
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: #a3ccf5;
        }

        /* TAM EKRAN OYUN FONU */
        .game-background {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background-image: url('https://unsplash.com'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
            filter: brightness(0.85);
        }

        /* OYUN POP-UP PANALİ (MODAL) */
        .game-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; 
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #4caf50;
            border-radius: 28px;
            padding: 30px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-box-header {
            font-size: 26px; 
            font-weight: bold; 
            color: #2e7d32; 
            margin-bottom: 15px;
        }

        .game-text { 
            font-size: 15px; 
            color: #555; 
            margin-bottom: 22px; 
            line-height: 1.5; 
        }

        .game-label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* INPUT VƏ SELECT STİLLƏRİ */
        .game-input, .game-select {
            width: 100%; 
            padding: 14px; 
            border-radius: 16px; 
            border: 2px solid #ccc;
            margin-bottom: 20px; 
            font-size: 16px; 
            outline: none; 
            transition: 0.2s;
            background: #f9f9f9;
        }
        .game-input:focus, .game-select:focus { 
            border-color: #4caf50; 
            background: #fff;
        }

        /* OYUN DÜYMƏSİ (BASILMA EFFEKTLİ) */
        .game-btn {
            width: 100%; 
            padding: 16px; 
            font-size: 18px; 
            font-weight: bold; 
            color: white;
            background: linear-gradient(135deg, #ff7a45, #de541e);
            border: none; 
            border-radius: 18px; 
            cursor: pointer; 
            box-shadow: 0 6px 0 #b33c0d;
            transition: 0.1s;
        }
        .game-btn:active { 
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b33c0d; 
        }

        /* VİRTUAL YOLDAŞ SEÇİMİ (GRID) */
        .companion-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 22px; 
        }

        .companion-card {
            background: white; 
            border: 2px solid #e0e0e0; 
            border-radius: 20px; 
            padding: 15px 10px; 
            cursor: pointer; 
            transition: 0.2s ease;
        }
        .companion-card:hover { transform: scale(1.04); }
        .companion-emoji { font-size: 36px; margin-bottom: 5px; }
        .companion-card h4 { font-size: 16px; color: #333; margin-bottom: 4px; }
        .companion-card p { font-size: 11px; color: #777; }

        .companion-card.selected { 
            border-color: #ff7a45; 
            background: #fff5f0; 
            box-shadow: 0 0 12px rgba(255, 122, 69, 0.4);
        }

        .hidden { display: none !important; }

        @keyframes popIn { 
            from { transform: translate(-50%, -45%) scale(0.85); opacity: 0; } 
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
        }
    </style>
</head>
<body>

    <!-- OYUNUN ARXA FONU -->
    <div class="game-background"></div>

    <!-- OYUNUN GİRİŞ PƏNCƏRƏSİ: AD VƏ YAŞ (ADDIM 1) -->
    <div class="game-box" id="step1">
        <div class="game-box-header">🏝️ Mindscape Adası</div>
        <p class="game-text">Xoş gəldin! Sənin şəxsi psixoloji adan qurulur. Başlamaq üçün adını qeyd et:</p>
        
        <input type="text" id="username" class="game-input" placeholder="Məsələn: Əli">
        
        <label class="game-label">Yaş Qrupunuz:</label>
        <select id="ageGroup" class="game-select">
            <option value="8-12">8 - 12 Yaş (İlkin İnkişaf)</option>
            <option value="13-18">13 - 18 Yaş (Yeniyetmə)</option>
        </select>

        <button class="game-btn" onclick="goToStep2()">Davam Et ➔</button>
    </div>

    <!-- VİRTUAL YOLDAŞ SEÇİMİ (ADDIM 2 - İLK BAŞDA GİZLİDİR) -->
    <div class="game-box hidden" id="step2">
        <div class="game-box-header">🦊 Bələdçini Seç</div>
        <p class="game-text">Adada sənə yoldaşlıq edəcək dostunu seç:</p>
        
        <div class="companion-grid">
            <div class="companion-card" onclick="selectCompanion(this, 'Panda')">
                <div class="companion-emoji">🐼</div>
                <h4>Panda</h4>
                <p>Nəfəs & Sakitlik</p>
            </div>
            <div class="companion-card" onclick="selectCompanion(this, 'Tülkü')">
                <div class="companion-emoji">🦊</div>
                <h4>Tülkü</h4>
                <p>İdrak & Diqqət</p>
            </div>
            <div class="companion-card" onclick="selectCompanion(this, 'Dovşan')">
                <div class="companion-emoji">🐰</div>
                <h4>Dovşan</h4>
                <p>Emosiyalar & Şən</p>
            </div>
            <div class="companion-card" onclick="selectCompanion(this, 'Ayı')">
                <div class="companion-emoji">🐻</div>
                <h4>Ayı</h4>
                <p>Cəsarət & Qoruyucu</p>
            </div>
        </div>

        <button class="game-btn" onclick="enterIsland()">Adaya Daxil Ol 🌱</button>
    </div>

    <script>
        let chosenCompanion = "";

        function goToStep2() {
            let name = document.getElementById('username').value.trim();
            if(!name) { 
                alert('Zəhmət olmasa adınızı yazın!'); 
                return; 
            }
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function selectCompanion(element, name) {
            document.querySelectorAll('.companion-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            chosenCompanion = name;
        }

        function enterIsland() {
            if(!chosenCompanion) {
                alert('Zəhmət olmasa bir bələdçi seçin!');
                return;
            }
            let name = document.getElementById('username').value;
            alert(`Uğurlu keçid! Xoş gəldin ${name}. ${chosenCompanion} səni adada gözləyir!`);
        }
    </script>
</body>
</html>
